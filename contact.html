<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Junior Coders</title>
    <meta name="description" content="Get in touch with the Junior Coders team.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>

    <div class="module-container">
        <header class="module-header">
            <h1>Contact Us</h1>
            <p>Have questions or feedback? We'd love to hear from you!</p>
        </header>

        <main class="content-section contact-content">
            <form id="contact-form" class="contact-form" onsubmit="event.preventDefault(); window.showToast('This demo form is not connected to email yet.', 'error');">
                <p class="form-notice">This demo checks your details but does not send email yet.</p>

                <div class="form-field">
                    <label for="contact-name">Your name</label>
                    <input id="contact-name" name="name" type="text" autocomplete="name" placeholder="Enter your name" required>
                </div>

                <div class="form-field">
                    <label for="contact-email">Your email</label>
                    <input id="contact-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
                </div>

                <div class="form-field">
                    <label for="contact-message">Message</label>
                    <textarea id="contact-message" name="message" rows="7" placeholder="How can we help?" required></textarea>
                </div>

                <button type="submit" class="btn-primary contact-submit">
                    Check my message
                </button>
            </form>
        </main>
    </div>

    <script src="js/core.js"></script>
</body>
</html>
