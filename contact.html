<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Junior Coders</title>
    <meta name="description" content="Get in touch with the Junior Coders team.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>

    <div class="module-container">
        <header class="module-header">
            <h1>Contact Us</h1>
            <p>Have questions or feedback? We'd love to hear from you!</p>
        </header>

        <main class="content-section" style="max-width: 600px; margin: 0 auto;">
            <form id="contact-form" class="quiz-section" onsubmit="event.preventDefault(); window.showToast('Message sent! We will get back to you soon. 🚀'); this.reset();">
                <div class="quiz-question" style="background: transparent; border: none; padding: 0;">
                    <label style="background: transparent; border: none; padding: 0; display: block; margin-bottom: 0.5rem; font-weight: 600;">Your Name</label>
                    <input type="text" placeholder="Enter your name" required style="width: 100%; padding: 1rem; border-radius: 1rem; border: 2px solid var(--border-dim); background: var(--bg-glass); color: white; outline: none;">
                </div>

                <div class="quiz-question" style="background: transparent; border: none; padding: 0; margin-top: 1.5rem;">
                    <label style="background: transparent; border: none; padding: 0; display: block; margin-bottom: 0.5rem; font-weight: 600;">Your Email</label>
                    <input type="email" placeholder="Enter your email" required style="width: 100%; padding: 1rem; border-radius: 1rem; border: 2px solid var(--border-dim); background: var(--bg-glass); color: white; outline: none;">
                </div>

                <div class="quiz-question" style="background: transparent; border: none; padding: 0; margin-top: 1.5rem;">
                    <label style="background: transparent; border: none; padding: 0; display: block; margin-bottom: 0.5rem; font-weight: 600;">Message</label>
                    <textarea placeholder="How can we help?" required style="width: 100%; height: 150px; padding: 1rem; border-radius: 1rem; border: 2px solid var(--border-dim); background: var(--bg-glass); color: white; outline: none; resize: vertical;"></textarea>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 2rem;">
                    🚀 Send Message
                </button>
            </form>
        </main>
    </div>

    <script src="js/core.js"></script>
</body>
</html>
