<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="100%">
  <defs>
    <style>
      .hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-size: 17px; fill: #1e293b; }
      .badge-code { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 11px; font-weight: 700; fill: #b45309; }
      .step-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 14px; fill: #ffffff; text-anchor: middle; }
      .step-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 15px; text-anchor: middle; }
      .step-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .code-term { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 11px; font-weight: 600; }
    </style>
    <marker id="cycleArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect width="880" height="460" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <rect x="25" y="18" width="830" height="44" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1" />
  <circle cx="50" cy="40" r="12" fill="#f59e0b" />
  <text x="50" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">⚡</text>
  <text x="72" y="45" class="hdr">The Event-Driven Lifecycle: Listen, Trigger, and React</text>
  
  <rect x="580" y="27" width="260" height="26" rx="6" fill="#ffffff" stroke="#fde68a" />
  <text x="710" y="44" class="badge-code" text-anchor="middle">btn.addEventListener("click", fn)</text>

  <!-- Flow Steps -->
  <g transform="translate(25, 85)">
    <!-- Card 1: Element Registration -->
    <g transform="translate(0, 0)">
      <rect width="250" height="265" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <circle cx="125" cy="35" r="16" fill="#0284c7" />
      <text x="125" y="40" class="step-num">1</text>
      
      <text x="125" y="75" class="step-title" fill="#0369a1">Install Listener</text>
      
      <text x="125" y="100" class="step-desc">
        <tspan x="125" dy="0">Target the HTML button in DOM</tspan>
        <tspan x="125" dy="16">and attach a passive "ear".</tspan>
      </text>
      
      <!-- Code Box -->
      <rect x="15" y="140" width="220" height="105" rx="8" fill="#0f172a" />
      <text x="25" y="165" class="code-term" fill="#94a3b8">// Select &amp; subscribe</text>
      <text x="25" y="185" class="code-term" fill="#38bdf8">const btn =</text>
      <text x="25" y="202" class="code-term" fill="#38bdf8">  document.querySelector</text>
      <text x="25" y="219" class="code-term" fill="#38bdf8">  ("#saveBtn");</text>
      <text x="25" y="234" class="code-term" fill="#fed7aa">btn.addEventListener(...)</text>
    </g>

    <!-- Arrow 1 to 2 -->
    <g transform="translate(250, 0)">
      <line x1="12" y1="120" x2="38" y2="120" stroke="#f59e0b" stroke-width="3" marker-end="url(#cycleArrow)" />
      <text x="25" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#b45309" text-anchor="middle">WAITING</text>
    </g>

    <!-- Card 2: User Action / Event Trigger -->
    <g transform="translate(290, 0)">
      <rect width="250" height="265" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="2" />
      <circle cx="125" cy="35" r="16" fill="#ea580c" />
      <text x="125" y="40" class="step-num">2</text>
      
      <text x="125" y="75" class="step-title" fill="#c2410c">User Interacts</text>
      
      <text x="125" y="100" class="step-desc">
        <tspan x="125" dy="0">A human clicks a button, types</tspan>
        <tspan x="125" dy="16">in a form, or presses Enter.</tspan>
      </text>
      
      <!-- Button Simulator Box -->
      <g transform="translate(15, 140)">
        <rect width="220" height="105" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2" />
        <rect x="35" y="18" width="150" height="38" rx="8" fill="#ea580c" />
        <text x="110" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle">Click Me! 🖱️</text>
        <text x="110" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#9a3412" text-anchor="middle">Event Dispatched:</text>
        <text x="110" y="92" class="code-term" fill="#c2410c" text-anchor="middle">MouseEvent { type: "click" }</text>
      </g>
    </g>

    <!-- Arrow 2 to 3 -->
    <g transform="translate(540, 0)">
      <line x1="12" y1="120" x2="38" y2="120" stroke="#f59e0b" stroke-width="3" marker-end="url(#cycleArrow)" />
      <text x="25" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#b45309" text-anchor="middle">TRIGGERS</text>
    </g>

    <!-- Card 3: Callback Execution -->
    <g transform="translate(580, 0)">
      <rect width="250" height="265" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
      <circle cx="125" cy="35" r="16" fill="#16a34a" />
      <text x="125" y="40" class="step-num">3</text>
      
      <text x="125" y="75" class="step-title" fill="#15803d">Execute Callback</text>
      
      <text x="125" y="100" class="step-desc">
        <tspan x="125" dy="0">JavaScript invokes the function</tspan>
        <tspan x="125" dy="16">and immediately updates the page.</tspan>
      </text>
      
      <!-- Code Box -->
      <rect x="15" y="140" width="220" height="105" rx="8" fill="#0f172a" />
      <text x="25" y="165" class="code-term" fill="#94a3b8">// Callback function</text>
      <text x="25" y="185" class="code-term" fill="#4ade80">function(event) {</text>
      <text x="25" y="202" class="code-term" fill="#4ade80">  counter++;</text>
      <text x="25" y="219" class="code-term" fill="#4ade80">  ui.innerText = counter;</text>
      <text x="25" y="234" class="code-term" fill="#4ade80">}</text>
    </g>

    <!-- Bottom summary banner -->
    <g transform="translate(0, 285)">
      <rect width="830" height="65" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="12" fill="#0f172a">Mental Model for Junior Coders:</text>
      <text x="20" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#475569">
        JavaScript does not wait actively or freeze your computer. The listener stays asleep in memory until the exact event occurs, at which point the browser wakes up the callback!
      </text>
    </g>
  </g>
</svg>
