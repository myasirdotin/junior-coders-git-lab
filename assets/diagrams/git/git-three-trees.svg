<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Outfit', -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: #0f172a; }
      .subtitle { font-family: 'Outfit', -apple-system, sans-serif; font-weight: 500; font-size: 13px; fill: #64748b; }
      .box-title { font-family: 'Outfit', -apple-system, sans-serif; font-weight: 700; font-size: 15px; }
      .desc { font-family: 'Outfit', -apple-system, sans-serif; font-weight: 400; font-size: 12px; fill: #475569; }
      .cmd { font-family: 'Fira Code', monospace; font-size: 11px; font-weight: 600; }
      .note { font-family: 'Outfit', -apple-system, sans-serif; font-size: 11px; fill: #64748b; font-style: italic; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f05032" />
    </marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16"/>
  <rect width="100%" height="100%" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="16"/>

  <!-- Title Section -->
  <text x="460" y="42" text-anchor="middle" class="title">The Git Architecture: Three Local Areas &amp; Cloud Remote</text>
  <text x="460" y="65" text-anchor="middle" class="subtitle">How changes travel from your text editor into the permanent commit history and GitHub</text>

  <!-- Area 1: Working Directory -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <rect width="180" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="180" height="42" rx="12" fill="#f1f5f9"/>
    <rect width="180" height="12" y="30" fill="#f1f5f9"/>
    <text x="90" y="26" text-anchor="middle" class="box-title" fill="#334155">1. Working Tree</text>
    
    <rect x="18" y="58" width="144" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="28" y="79" class="desc">📝 index.html (Edited)</text>

    <rect x="18" y="102" width="144" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="28" y="123" class="desc">🎨 style.css (New)</text>

    <rect x="18" y="146" width="144" height="34" rx="6" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="28" y="167" class="desc" fill="#991b1b">🔒 .env (Secrets / Gitignore)</text>

    <text x="90" y="215" text-anchor="middle" class="note">Your actual files on</text>
    <text x="90" y="232" text-anchor="middle" class="note">your computer disk</text>
  </g>

  <!-- Arrow 1 -> 2: git add -->
  <g transform="translate(225, 185)">
    <path d="M 5 35 L 55 35" fill="none" stroke="#f05032" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="3" y="2" width="56" height="22" rx="4" fill="#ffedd5" stroke="#fed7aa"/>
    <text x="31" y="17" text-anchor="middle" class="cmd" fill="#c2410c">git add</text>
  </g>

  <!-- Area 2: Staging Area (Index) -->
  <g transform="translate(290, 100)" filter="url(#shadow)">
    <rect width="180" height="250" rx="12" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
    <rect width="180" height="42" rx="12" fill="#fff7ed"/>
    <rect width="180" height="12" y="30" fill="#fff7ed"/>
    <text x="90" y="26" text-anchor="middle" class="box-title" fill="#c2410c">2. Staging Area</text>
    
    <rect x="18" y="58" width="144" height="34" rx="6" fill="#ffedd5" stroke="#fed7aa"/>
    <text x="28" y="79" class="desc" fill="#9a3412">✓ index.html</text>

    <rect x="18" y="102" width="144" height="34" rx="6" fill="#ffedd5" stroke="#fed7aa"/>
    <text x="28" y="123" class="desc" fill="#9a3412">✓ style.css</text>

    <text x="90" y="170" text-anchor="middle" class="note">The "Drafting Table" or</text>
    <text x="90" y="188" text-anchor="middle" class="note">Pre-shipment Box.</text>
    <text x="90" y="210" text-anchor="middle" class="note">Choose exactly what goes</text>
    <text x="90" y="228" text-anchor="middle" class="note">into your next commit!</text>
  </g>

  <!-- Arrow 2 -> 3: git commit -->
  <g transform="translate(475, 185)">
    <path d="M 5 35 L 55 35" fill="none" stroke="#f05032" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="-4" y="2" width="70" height="22" rx="4" fill="#ffedd5" stroke="#fed7aa"/>
    <text x="31" y="17" text-anchor="middle" class="cmd" fill="#c2410c">git commit</text>
  </g>

  <!-- Area 3: Local Repository (.git) -->
  <g transform="translate(540, 100)" filter="url(#shadow)">
    <rect width="180" height="250" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <rect width="180" height="42" rx="12" fill="#f0fdf4"/>
    <rect width="180" height="12" y="30" fill="#f0fdf4"/>
    <text x="90" y="26" text-anchor="middle" class="box-title" fill="#15803d">3. Local Repo (.git)</text>
    
    <!-- Snapshot Box -->
    <rect x="18" y="58" width="144" height="42" rx="6" fill="#dcfce7" stroke="#86efac"/>
    <text x="28" y="77" class="desc" font-weight="600" fill="#166534">Commit [a4f8e2]</text>
    <text x="28" y="92" class="desc" font-size="10px" fill="#15803d">"Add navigation header"</text>

    <!-- Snapshot Box -->
    <rect x="18" y="108" width="144" height="42" rx="6" fill="#dcfce7" stroke="#86efac"/>
    <text x="28" y="127" class="desc" font-weight="600" fill="#166534">Commit [b9c1d0]</text>
    <text x="28" y="142" class="desc" font-size="10px" fill="#15803d">"Initial site blueprint"</text>

    <text x="90" y="195" text-anchor="middle" class="note">Permanent Time Capsules</text>
    <text x="90" y="213" text-anchor="middle" class="note">stored securely inside</text>
    <text x="90" y="231" text-anchor="middle" class="note">hidden .git folder!</text>
  </g>

  <!-- Arrow 3 -> 4: git push -->
  <g transform="translate(725, 185)">
    <path d="M 5 35 L 55 35" fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#blueArrow)"/>
    <rect x="1" y="2" width="60" height="22" rx="4" fill="#e0f2fe" stroke="#bae6fd"/>
    <text x="31" y="17" text-anchor="middle" class="cmd" fill="#0284c7">git push</text>
  </g>

  <!-- Area 4: GitHub Cloud Remote -->
  <g transform="translate(785, 100)" filter="url(#shadow)">
    <rect width="105" height="250" rx="12" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
    <rect width="105" height="42" rx="12" fill="#f0f9ff"/>
    <rect width="105" height="12" y="30" fill="#f0f9ff"/>
    <text x="52" y="26" text-anchor="middle" class="box-title" fill="#0369a1">4. GitHub</text>

    <!-- Cloud Icon Mock -->
    <circle cx="52" cy="85" r="22" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="52" y="92" text-anchor="middle" font-size="20px">☁️</text>

    <text x="52" y="135" text-anchor="middle" class="desc" font-weight="600" fill="#0369a1">Cloud Hub</text>
    <text x="52" y="170" text-anchor="middle" class="note">Online</text>
    <text x="52" y="188" text-anchor="middle" class="note">Backup &amp;</text>
    <text x="52" y="206" text-anchor="middle" class="note">Worldwide</text>
    <text x="52" y="224" text-anchor="middle" class="note">Sharing</text>
  </g>

  <!-- Bottom Flow Legend -->
  <rect x="150" y="375" width="620" height="30" rx="15" fill="#f1f5f9"/>
  <text x="460" y="395" text-anchor="middle" class="desc">
    <tspan fill="#f05032" font-weight="700">Daily Loop: </tspan>
    Edit Code ➔ <tspan font-family="monospace">git add</tspan> (Stage) ➔ <tspan font-family="monospace">git commit</tspan> (Record) ➔ <tspan font-family="monospace">git push</tspan> (Publish)
  </text>
</svg>
