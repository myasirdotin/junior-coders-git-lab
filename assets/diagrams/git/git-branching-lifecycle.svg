<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Outfit', -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: #0f172a; }
      .subtitle { font-family: 'Outfit', -apple-system, sans-serif; font-weight: 500; font-size: 13px; fill: #64748b; }
      .branch-name { font-family: 'Fira Code', monospace; font-size: 13px; font-weight: 700; }
      .commit-text { font-family: 'Outfit', -apple-system, sans-serif; font-size: 11px; fill: #334155; font-weight: 600; }
      .commit-hash { font-family: 'Fira Code', monospace; font-size: 10px; fill: #64748b; }
      .legend-text { font-family: 'Outfit', -apple-system, sans-serif; font-size: 12px; fill: #475569; }
    </style>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad2)" rx="16"/>
  <rect width="100%" height="100%" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="16"/>

  <!-- Title -->
  <text x="460" y="38" text-anchor="middle" class="title">Git Branching &amp; Merging Lifecycle</text>
  <text x="460" y="60" text-anchor="middle" class="subtitle">Creating parallel timelines for new features without risking production code</text>

  <!-- Main Line (Blue) -->
  <line x1="80" y1="130" x2="840" y2="130" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Branch Out Line -->
  <path d="M 270 130 C 330 130, 330 250, 390 250" fill="none" stroke="#f05032" stroke-width="3.5" stroke-dasharray="6,4"/>
  <!-- Feature Line -->
  <line x1="390" y1="250" x2="570" y2="250" stroke="#f05032" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Merge Back Line -->
  <path d="M 570 250 C 630 250, 630 130, 690 130" fill="none" stroke="#10b981" stroke-width="3.5" marker-end="url(#arrow)"/>

  <!-- Labels -->
  <rect x="70" y="90" width="75" height="24" rx="6" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="107" y="106" text-anchor="middle" class="branch-name" fill="#0284c7">main</text>

  <rect x="360" y="280" width="130" height="24" rx="6" fill="#ffedd5" stroke="#fb923c"/>
  <text x="425" y="296" text-anchor="middle" class="branch-name" fill="#c2410c">feature/navbar</text>

  <!-- Commit C1 (main) -->
  <g transform="translate(160, 130)" filter="url(#shadow2)">
    <circle r="18" fill="#ffffff" stroke="#0284c7" stroke-width="4"/>
    <text x="0" y="4" text-anchor="middle" class="commit-text">C1</text>
    <text x="0" y="-26" text-anchor="middle" class="commit-hash">c8f12a</text>
    <text x="0" y="38" text-anchor="middle" class="commit-text">Initial Base</text>
  </g>

  <!-- Commit C2 (main branching point) -->
  <g transform="translate(270, 130)" filter="url(#shadow2)">
    <circle r="18" fill="#ffffff" stroke="#0284c7" stroke-width="4"/>
    <text x="0" y="4" text-anchor="middle" class="commit-text">C2</text>
    <text x="0" y="-26" text-anchor="middle" class="commit-hash">4e91ba</text>
    <text x="0" y="38" text-anchor="middle" class="commit-text">git switch -c ...</text>
  </g>

  <!-- Commit C3 (feature branch) -->
  <g transform="translate(410, 250)" filter="url(#shadow2)">
    <circle r="18" fill="#ffffff" stroke="#f05032" stroke-width="4"/>
    <text x="0" y="4" text-anchor="middle" class="commit-text">C3</text>
    <text x="0" y="36" text-anchor="middle" class="commit-hash">7a3f01</text>
    <text x="0" y="52" text-anchor="middle" class="commit-text">Add Nav Links</text>
  </g>

  <!-- Commit C4 (feature branch) -->
  <g transform="translate(540, 250)" filter="url(#shadow2)">
    <circle r="18" fill="#ffffff" stroke="#f05032" stroke-width="4"/>
    <text x="0" y="4" text-anchor="middle" class="commit-text">C4</text>
    <text x="0" y="36" text-anchor="middle" class="commit-hash">9b12e6</text>
    <text x="0" y="52" text-anchor="middle" class="commit-text">Add CSS Styles</text>
  </g>

  <!-- Commit C5 (main progress concurrently) -->
  <g transform="translate(480, 130)" filter="url(#shadow2)">
    <circle r="18" fill="#ffffff" stroke="#0284c7" stroke-width="4"/>
    <text x="0" y="4" text-anchor="middle" class="commit-text">C5</text>
    <text x="0" y="-26" text-anchor="middle" class="commit-hash">12d8a4</text>
    <text x="0" y="38" text-anchor="middle" class="commit-text">Fix Footer Bug</text>
  </g>

  <!-- Commit C6 (Merge Commit) -->
  <g transform="translate(690, 130)" filter="url(#shadow2)">
    <circle r="20" fill="#10b981" stroke="#047857" stroke-width="3"/>
    <text x="0" y="5" text-anchor="middle" class="commit-text" fill="#ffffff">C6</text>
    <text x="0" y="-28" text-anchor="middle" class="commit-hash" font-weight="700">MERGE</text>
    <text x="0" y="40" text-anchor="middle" class="commit-text" fill="#047857">git merge navbar</text>
  </g>

  <!-- Legend at Bottom -->
  <rect x="180" y="335" width="560" height="32" rx="8" fill="#f1f5f9"/>
  <text x="460" y="356" text-anchor="middle" class="legend-text">
    🔵 <tspan font-weight="600">Stable Main</tspan> &nbsp;&nbsp;|&nbsp;&nbsp; 
    🟠 <tspan font-weight="600">Isolated Feature Work</tspan> &nbsp;&nbsp;|&nbsp;&nbsp; 
    🟢 <tspan font-weight="600">Safe Conflict-Free Merge</tspan>
  </text>
</svg>
