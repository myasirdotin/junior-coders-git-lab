<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%">
  <defs>
    <style>
      .hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-size: 16px; fill: #1e293b; }
      .badge-arch { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #6d28d9; }
      .col-head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 14px; fill: #0f172a; text-anchor: middle; }
      .col-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; text-anchor: middle; }
      .arrow-lbl { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 10px; font-weight: 700; text-anchor: middle; }
      .code-term { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 10.5px; }
      .feat-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #334155; }
    </style>
    <marker id="phpReqArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7c3aed" />
    </marker>
    <marker id="phpResArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#10b981" />
    </marker>
    <marker id="sqlReqArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#0891b2" />
    </marker>
    <marker id="sqlResArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#0891b2" />
    </marker>
  </defs>

  <rect width="880" height="480" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <rect x="25" y="16" width="830" height="44" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1" />
  <circle cx="50" cy="38" r="12" fill="#8b5cf6" />
  <text x="50" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">🌐</text>
  <text x="72" y="43" class="hdr">Client-Server Web Architecture: The PHP Request/Response Cycle</text>
  
  <rect x="620" y="25" width="220" height="26" rx="6" fill="#ffffff" stroke="#ddd6fe" />
  <text x="730" y="42" class="badge-arch" text-anchor="middle">Browser ⇄ PHP Server ⇄ MySQL</text>

  <!-- 3 Pillars Section -->
  <g transform="translate(25, 75)">
    <!-- Column 1: Client / Browser (w=220) -->
    <g transform="translate(0, 0)">
      <rect width="220" height="325" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      
      <!-- Browser Top Chrome UI -->
      <rect x="12" y="12" width="196" height="28" rx="6" fill="#e2e8f0" />
      <circle cx="26" cy="26" r="4" fill="#ef4444" />
      <circle cx="38" cy="26" r="4" fill="#f59e0b" />
      <circle cx="50" cy="26" r="4" fill="#10b981" />
      <rect x="64" y="18" width="134" height="16" rx="3" fill="#ffffff" />
      <text x="131" y="30" font-family="'SFMono-Regular', Consolas, monospace" font-size="9" fill="#64748b" text-anchor="middle">mysite.com/store.php</text>

      <text x="110" y="70" class="col-head">Client (Web Browser)</text>
      <text x="110" y="88" class="col-sub">Chrome, Firefox, Safari, Edge</text>

      <!-- Client Feature Box -->
      <rect x="15" y="105" width="190" height="195" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <text x="25" y="130" class="feat-txt" font-weight="700" fill="#0284c7">What Client Does:</text>
      <text x="25" y="152" class="feat-txt">• Sends HTTP GET / POST</text>
      <text x="25" y="172" class="feat-txt">• Parses &amp; displays HTML/CSS</text>
      <text x="25" y="192" class="feat-txt">• Executes JavaScript locally</text>
      
      <!-- Warning Note -->
      <rect x="22" y="215" width="176" height="70" rx="6" fill="#fef2f2" stroke="#fecaca" />
      <text x="110" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">🔒 Privacy / Security:</text>
      <text x="110" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle">Browser NEVER sees raw PHP code,</text>
      <text x="110" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle">database passwords, or SQL queries!</text>
    </g>

    <!-- Center Arrows: Client <-> Server (w=100) -->
    <g transform="translate(225, 0)">
      <!-- Top Arrow (Request) -->
      <path d="M 10,80 L 85,80" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#phpReqArrow)" />
      <rect x="8" y="48" width="84" height="24" rx="5" fill="#f5f3ff" stroke="#ddd6fe" />
      <text x="50" y="64" class="arrow-lbl" fill="#6d28d9">1. HTTP GET</text>

      <!-- Bottom Arrow (Response) -->
      <path d="M 85,220 L 10,220" stroke="#10b981" stroke-width="2.5" marker-end="url(#phpResArrow)" />
      <rect x="8" y="228" width="84" height="24" rx="5" fill="#ecfdf5" stroke="#a7f3d0" />
      <text x="50" y="244" class="arrow-lbl" fill="#047857">4. Pure HTML</text>
    </g>

    <!-- Column 2: Server-Side Engine (w=265) -->
    <g transform="translate(330, 0)">
      <rect width="265" height="325" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2" />
      
      <!-- Top Tag -->
      <rect x="25" y="14" width="215" height="26" rx="6" fill="#7c3aed" />
      <text x="132" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#ffffff" text-anchor="middle">Apache / Nginx + PHP Engine</text>

      <text x="132" y="65" class="col-head" fill="#4c1d95">Server-Side Environment</text>
      <text x="132" y="82" class="col-sub">Executes store.php in RAM</text>

      <!-- Code Execution Simulation Terminal -->
      <rect x="15" y="98" width="235" height="210" rx="8" fill="#1e1b4b" />
      <text x="25" y="122" class="code-term" fill="#c4b5fd">&lt;?php // Runs on Server</text>
      <text x="25" y="142" class="code-term" fill="#93c5fd">// 1. Validate inputs</text>
      <text x="25" y="158" class="code-term" fill="#fde047">$cat = filter_input(...);</text>
      <text x="25" y="180" class="code-term" fill="#93c5fd">// 2. Query MySQL (PDO)</text>
      <text x="25" y="196" class="code-term" fill="#a7f3d0">$stmt = $pdo-&gt;prepare(...);</text>
      <text x="25" y="218" class="code-term" fill="#93c5fd">// 3. Generate HTML</text>
      <text x="25" y="234" class="code-term" fill="#f472b6">echo "&lt;ul&gt;...&lt;/ul&gt;";</text>
      <text x="25" y="254" class="code-term" fill="#c4b5fd">?&gt;</text>
      
      <!-- Safe Stamp -->
      <rect x="25" y="268" width="215" height="28" rx="4" fill="#312e81" />
      <text x="132" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#a5b4fc" text-anchor="middle">Only generated HTML leaves the server</text>
    </g>

    <!-- Right Arrows: Server <-> Database (w=80) -->
    <g transform="translate(600, 0)">
      <!-- Top Query Arrow -->
      <path d="M 5,130 L 65,130" stroke="#0891b2" stroke-width="2" marker-end="url(#sqlReqArrow)" />
      <text x="35" y="120" class="arrow-lbl" fill="#0891b2">2. SQL Query</text>

      <!-- Bottom Result Arrow -->
      <path d="M 65,185 L 5,185" stroke="#0891b2" stroke-width="2" marker-end="url(#sqlResArrow)" />
      <text x="35" y="202" class="arrow-lbl" fill="#0891b2">3. Data Rows</text>
    </g>

    <!-- Column 3: Database (MySQL) (w=150) -->
    <g transform="translate(680, 0)">
      <rect width="150" height="325" rx="12" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.5" />
      
      <rect x="20" y="14" width="110" height="26" rx="6" fill="#0891b2" />
      <text x="75" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#ffffff" text-anchor="middle">MySQL</text>

      <text x="75" y="65" class="col-head" fill="#155e75">Database</text>
      <text x="75" y="82" class="col-sub">Storage Engine</text>

      <!-- 3D Cylinder Graphic -->
      <g transform="translate(35, 100)">
        <ellipse cx="40" cy="14" rx="36" ry="12" fill="#0891b2" />
        <path d="M 4,14 L 4,55 A 36,12 0 0,0 76,55 L 76,14 Z" fill="#22d3ee" stroke="#0891b2" stroke-width="1.5" />
        <ellipse cx="40" cy="55" rx="36" ry="12" fill="#0891b2" />
        
        <path d="M 4,55 L 4,95 A 36,12 0 0,0 76,95 L 76,55 Z" fill="#06b6d4" stroke="#0891b2" stroke-width="1.5" />
        <ellipse cx="40" cy="95" rx="36" ry="12" fill="#0e7490" />
      </g>

      <rect x="15" y="235" width="120" height="65" rx="6" fill="#ffffff" stroke="#cffafe" />
      <text x="75" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0e7490" text-anchor="middle">Tables &amp; Records:</text>
      <text x="75" y="272" class="code-term" fill="#155e75" text-anchor="middle">products</text>
      <text x="75" y="287" class="code-term" fill="#155e75" text-anchor="middle">categories, users</text>
    </g>
  </g>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(25, 415)">
    <rect width="830" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="20" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="12" fill="#0f172a">Core Principle for Full-Stack Developers:</text>
    <text x="20" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#475569">
      PHP is the translator: it receives client requests, queries relational data safely, generates pure HTML, and sends only the rendered page back to the browser.
    </text>
  </g>
</svg>
