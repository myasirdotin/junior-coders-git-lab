<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%">
  <defs>
    <style>
      .hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-size: 16.5px; fill: #1e293b; }
      .badge-code { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #0e7490; }
      .tbl-head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 13px; fill: #ffffff; text-anchor: middle; }
      .col-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 11px; fill: #334155; }
      .cell-mono { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 11px; }
      .anno-h { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 12px; }
      .anno-p { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
    </style>
    <marker id="relFkArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#0284c7" />
    </marker>
  </defs>

  <rect width="880" height="480" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <rect x="25" y="16" width="830" height="44" rx="8" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1" />
  <circle cx="50" cy="38" r="12" fill="#0891b2" />
  <text x="50" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">🔗</text>
  <text x="72" y="43" class="hdr">Relational Architecture: Primary Key to Foreign Key Mapping</text>
  
  <rect x="670" y="25" width="170" height="26" rx="6" fill="#ffffff" stroke="#a5f3fc" />
  <text x="755" y="42" class="badge-code" text-anchor="middle">Parent-Child Integrity</text>

  <!-- Relational Tables Section -->
  <g transform="translate(30, 80)">
    <!-- 1. PARENT TABLE: courses (w=360) -->
    <g transform="translate(0, 0)">
      <rect width="365" height="205" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2" />
      <rect width="365" height="34" rx="10" fill="#0891b2" />
      <rect y="22" width="365" height="12" fill="#0891b2" />
      <text x="182" y="22" class="tbl-head">PARENT TABLE: courses</text>

      <!-- Columns Bar -->
      <rect y="34" width="365" height="28" fill="#f0fdfa" />
      <text x="15" y="52" class="col-lbl" fill="#0891b2">id (PRIMARY KEY 🔑)</text>
      <text x="150" y="52" class="col-lbl">course_name</text>
      <text x="275" y="52" class="col-lbl">teacher</text>
      <line x1="0" y1="62" x2="365" y2="62" stroke="#ccfbf1" />

      <!-- Row 1 (Course 10) -->
      <rect x="0" y="62" width="365" height="42" fill="#ffffff" />
      <!-- Highlight Box for PK 10 -->
      <rect x="10" y="68" width="80" height="30" rx="5" fill="#cffafe" stroke="#0891b2" stroke-width="1.5" />
      <text x="50" y="88" class="cell-mono" font-weight="bold" fill="#0e7490" text-anchor="middle">10</text>
      <text x="150" y="88" class="cell-mono" fill="#1e293b">Web Engineering</text>
      <text x="275" y="88" class="cell-mono" fill="#475569">Sir Yasir</text>
      <line x1="0" y1="104" x2="365" y2="104" stroke="#f1f5f9" />

      <!-- Row 2 (Course 20) -->
      <rect x="0" y="104" width="365" height="42" fill="#f8fafc" />
      <!-- Highlight Box for PK 20 -->
      <rect x="10" y="110" width="80" height="30" rx="5" fill="#cffafe" stroke="#0891b2" stroke-width="1.5" />
      <text x="50" y="130" class="cell-mono" font-weight="bold" fill="#0e7490" text-anchor="middle">20</text>
      <text x="150" y="130" class="cell-mono" fill="#1e293b">Database Systems</text>
      <text x="275" y="130" class="cell-mono" fill="#475569">Dr. Amina</text>
      <line x1="0" y1="146" x2="365" y2="146" stroke="#f1f5f9" />

      <!-- Row 3 (Course 30) -->
      <rect x="0" y="146" width="365" height="42" fill="#ffffff" />
      <text x="50" y="172" class="cell-mono" fill="#64748b" text-anchor="middle">30</text>
      <text x="150" y="172" class="cell-mono" fill="#64748b">Digital Ethics</text>
      <text x="275" y="172" class="cell-mono" fill="#64748b">Ustadh Tariq</text>
    </g>

    <!-- 2. CHILD TABLE: students (w=415) -->
    <g transform="translate(415, 0)">
      <rect width="405" height="205" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
      <rect width="405" height="34" rx="10" fill="#0284c7" />
      <rect y="22" width="405" height="12" fill="#0284c7" />
      <text x="202" y="22" class="tbl-head">CHILD TABLE: students</text>

      <!-- Columns Bar -->
      <rect y="34" width="405" height="28" fill="#f0f9ff" />
      <text x="15" y="52" class="col-lbl" fill="#0284c7">id (PK)</text>
      <text x="90" y="52" class="col-lbl">full_name</text>
      <text x="240" y="52" class="col-lbl" fill="#0284c7">course_id (FOREIGN KEY 🔗)</text>
      <line x1="0" y1="62" x2="405" y2="62" stroke="#e0f2fe" />

      <!-- Student 1 -->
      <rect x="0" y="62" width="405" height="42" fill="#ffffff" />
      <text x="35" y="88" class="cell-mono" fill="#64748b" text-anchor="middle">1</text>
      <text x="90" y="88" class="cell-mono" fill="#1e293b">"Aisha Siddiq"</text>
      <!-- FK Box 10 -->
      <rect x="250" y="68" width="90" height="30" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
      <text x="295" y="88" class="cell-mono" font-weight="bold" fill="#0369a1" text-anchor="middle">10</text>
      <line x1="0" y1="104" x2="405" y2="104" stroke="#f1f5f9" />

      <!-- Student 2 -->
      <rect x="0" y="104" width="405" height="42" fill="#f8fafc" />
      <text x="35" y="130" class="cell-mono" fill="#64748b" text-anchor="middle">2</text>
      <text x="90" y="130" class="cell-mono" fill="#1e293b">"Bilal Mansoor"</text>
      <!-- FK Box 10 -->
      <rect x="250" y="110" width="90" height="30" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
      <text x="295" y="130" class="cell-mono" font-weight="bold" fill="#0369a1" text-anchor="middle">10</text>
      <line x1="0" y1="146" x2="405" y2="146" stroke="#f1f5f9" />

      <!-- Student 3 -->
      <rect x="0" y="146" width="405" height="42" fill="#ffffff" />
      <text x="35" y="172" class="cell-mono" fill="#64748b" text-anchor="middle">3</text>
      <text x="90" y="172" class="cell-mono" fill="#1e293b">"Fatima Zahra"</text>
      <!-- FK Box 20 -->
      <rect x="250" y="152" width="90" height="30" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
      <text x="295" y="172" class="cell-mono" font-weight="bold" fill="#0369a1" text-anchor="middle">20</text>
    </g>

    <!-- Visual Connecting Arrows (Bridging Foreign Key -> Primary Key) -->
    <!-- Curved Path from student.course_id (250) back to courses.id (90) -->
    <path d="M 665,83 C 580,30 380,30 100,83" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#relFkArrow)" />
    <rect x="350" y="10" width="120" height="22" rx="4" fill="#0284c7" />
    <text x="410" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">REFERENCES id</text>
  </g>

  <!-- Bottom Three Pillars of Referential Integrity -->
  <g transform="translate(30, 310)">
    <!-- Pillar 1 -->
    <rect x="0" y="0" width="260" height="135" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
    <rect x="15" y="12" width="230" height="22" rx="4" fill="#0891b2" />
    <text x="130" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1. Elimination of Redundancy</text>
    <text x="15" y="55" class="anno-p">
      <tspan x="15" dy="0">Course details (teacher, room)</tspan>
      <tspan x="15" dy="16">are defined only once in the parent</tspan>
      <tspan x="15" dy="16">table, avoiding repetitive bloat.</tspan>
    </text>

    <!-- Pillar 2 -->
    <rect x="280" y="0" width="260" height="135" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
    <rect x="295" y="12" width="230" height="22" rx="4" fill="#0284c7" />
    <text x="410" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2. Referential Integrity</text>
    <text x="295" y="55" class="anno-p">
      <tspan x="295" dy="0">MySQL rejects inserting any</tspan>
      <tspan x="295" dy="16"><tspan font-family="'SFMono-Regular', Consolas, monospace">course_id = 99</tspan> because ID 99</tspan>
      <tspan x="295" dy="16">does not exist in the parent table!</tspan>
    </text>

    <!-- Pillar 3 -->
    <rect x="560" y="0" width="260" height="135" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
    <rect x="575" y="12" width="230" height="22" rx="4" fill="#059669" />
    <text x="690" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3. Seamless JOIN Queries</text>
    <text x="575" y="55" class="anno-p">
      <tspan x="575" dy="0">SQL queries reconstruct student</tspan>
      <tspan x="575" dy="16">names and their course titles</tspan>
      <tspan x="575" dy="16">instantly with <tspan font-family="'SFMono-Regular', Consolas, monospace">ON s.course_id = c.id</tspan>.</tspan>
    </text>
  </g>
</svg>
