<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="100%" height="100%">
  <defs>
    <style>
      .hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-size: 16.5px; fill: #1e293b; }
      .badge-code { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 11px; font-weight: 700; fill: #0e7490; }
      .join-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 14px; text-anchor: middle; }
      .join-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .join-code { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 10px; font-weight: 700; text-anchor: middle; }
      .table-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 800; text-anchor: middle; }
    </style>
  </defs>

  <rect width="880" height="470" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <rect x="25" y="16" width="830" height="44" rx="8" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1" />
  <circle cx="50" cy="38" r="12" fill="#0891b2" />
  <text x="50" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">🗄️</text>
  <text x="72" y="43" class="hdr">SQL JOINs Visualized: Combining Relational Tables</text>
  
  <rect x="560" y="25" width="280" height="26" rx="6" fill="#ffffff" stroke="#a5f3fc" />
  <text x="700" y="42" class="badge-code" text-anchor="middle">FROM TableA JOIN TableB ON A.id = B.a_id</text>

  <!-- 3 Join Cards -->
  <g transform="translate(25, 75)">
    <!-- 1. INNER JOIN (w=260) -->
    <g transform="translate(0, 0)">
      <rect width="260" height="315" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="15" y="15" width="230" height="28" rx="6" fill="#0891b2" />
      <text x="130" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle">INNER JOIN</text>

      <!-- Venn Diagram Graphic -->
      <g transform="translate(15, 55)">
        <circle cx="78" cy="55" r="44" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
        <text x="50" y="59" class="table-lbl" fill="#64748b">Table A</text>
        
        <circle cx="152" cy="55" r="44" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
        <text x="180" y="59" class="table-lbl" fill="#64748b">Table B</text>

        <!-- Intersection Area -->
        <path d="M 115,22 A 44,44 0 0,1 115,88 A 44,44 0 0,1 115,22" fill="#06b6d4" />
        <circle cx="115" cy="55" r="4" fill="#ffffff" />
      </g>

      <text x="130" y="180" class="join-title" fill="#0e7490">Only Matching Rows</text>
      <text x="130" y="202" class="join-desc">
        <tspan x="130" dy="0">Returns records with a match</tspan>
        <tspan x="130" dy="16">in BOTH Table A and Table B.</tspan>
      </text>
      
      <!-- Code Snip Box -->
      <rect x="15" y="240" width="230" height="38" rx="6" fill="#0f172a" />
      <text x="130" y="264" class="join-code" fill="#38bdf8">ON A.id = B.author_id</text>

      <text x="130" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#059669" text-anchor="middle">✓ Excludes orphaned rows</text>
    </g>

    <!-- 2. LEFT JOIN (w=260) -->
    <g transform="translate(285, 0)">
      <rect width="260" height="315" rx="12" fill="#ecfeff" stroke="#67e8f9" stroke-width="2" />
      <rect x="15" y="15" width="230" height="28" rx="6" fill="#0284c7" />
      <text x="130" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle">LEFT JOIN (or LEFT OUTER)</text>

      <!-- Venn Diagram Graphic -->
      <g transform="translate(15, 55)">
        <!-- Table B in back -->
        <circle cx="152" cy="55" r="44" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
        <text x="180" y="59" class="table-lbl" fill="#64748b">Table B</text>

        <!-- Table A completely colored -->
        <circle cx="78" cy="55" r="44" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />
        <text x="50" y="59" class="table-lbl" fill="#0c4a6e">Table A</text>

        <!-- Intersection -->
        <path d="M 115,22 A 44,44 0 0,1 115,88 A 44,44 0 0,1 115,22" fill="#0284c7" />
      </g>

      <text x="130" y="180" class="join-title" fill="#0369a1">All Left Rows + Matched Right</text>
      <text x="130" y="202" class="join-desc">
        <tspan x="130" dy="0">Preserves ALL rows from Table A.</tspan>
        <tspan x="130" dy="16">Fills missing B data with NULL.</tspan>
      </text>
      
      <!-- Code Snip Box -->
      <rect x="15" y="240" width="230" height="38" rx="6" fill="#0f172a" />
      <text x="130" y="264" class="join-code" fill="#7dd3fc">FROM users LEFT JOIN posts</text>

      <text x="130" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#0284c7" text-anchor="middle">✓ Never drops user records</text>
    </g>

    <!-- 3. RIGHT JOIN (w=260) -->
    <g transform="translate(570, 0)">
      <rect width="260" height="315" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="15" y="15" width="230" height="28" rx="6" fill="#4f46e5" />
      <text x="130" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle">RIGHT JOIN (or RIGHT OUTER)</text>

      <!-- Venn Diagram Graphic -->
      <g transform="translate(15, 55)">
        <!-- Table A in back -->
        <circle cx="78" cy="55" r="44" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
        <text x="50" y="59" class="table-lbl" fill="#64748b">Table A</text>

        <!-- Table B completely colored -->
        <circle cx="152" cy="55" r="44" fill="#818cf8" stroke="#4f46e5" stroke-width="2" />
        <text x="180" y="59" class="table-lbl" fill="#ffffff">Table B</text>

        <!-- Intersection -->
        <path d="M 115,22 A 44,44 0 0,0 115,88 A 44,44 0 0,0 115,22" fill="#4f46e5" />
      </g>

      <text x="130" y="180" class="join-title" fill="#3730a3">All Right Rows + Matched Left</text>
      <text x="130" y="202" class="join-desc">
        <tspan x="130" dy="0">Preserves ALL rows from Table B.</tspan>
        <tspan x="130" dy="16">Fills missing A data with NULL.</tspan>
      </text>
      
      <!-- Code Snip Box -->
      <rect x="15" y="240" width="230" height="38" rx="6" fill="#0f172a" />
      <text x="130" y="264" class="join-code" fill="#a5b4fc">FROM users RIGHT JOIN posts</text>

      <text x="130" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#4338ca" text-anchor="middle">✓ Useful for reverse queries</text>
    </g>
  </g>

  <!-- Bottom Summary Takeaway -->
  <g transform="translate(25, 405)">
    <rect width="830" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="20" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="12" fill="#0f172a">Rule of Thumb for Developers:</text>
    <text x="20" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#475569">
      Use INNER JOIN when data must exist in both tables. Use LEFT JOIN when you want to keep your primary records even if related records are empty (e.g., users with 0 comments).
    </text>
  </g>
</svg>
