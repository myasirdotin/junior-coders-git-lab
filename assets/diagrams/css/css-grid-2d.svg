<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%">
  <defs>
    <style>
      .hdr-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 17px; fill: #1e293b; }
      .hdr-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #1d4ed8; }
      .card-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #1e293b; text-anchor: middle; }
      .code-pos { font-family: 'Fira Code', Consolas, monospace; font-size: 11px; fill: #64748b; text-anchor: middle; }
      .track-header { font-family: 'Fira Code', Consolas, monospace; font-size: 12px; font-weight: 700; fill: #0284c7; text-anchor: middle; }
      .row-header { font-family: 'Fira Code', Consolas, monospace; font-size: 12px; font-weight: 700; fill: #475569; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="880" height="480" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Top Title Banner -->
  <g transform="translate(30, 20)">
    <rect width="820" height="42" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <circle cx="24" cy="21" r="10" fill="#2563eb" />
    <text x="24" y="25" font-family="-apple-system, sans-serif" font-weight="bold" font-size="11" fill="#ffffff" text-anchor="middle">🧇</text>
    <text x="44" y="27" class="hdr-title">CSS Grid: 2D Simultaneous Row &amp; Column Matrix</text>
    <text x="800" y="26" class="hdr-sub" text-anchor="end">grid-template-columns: repeat(3, 1fr);</text>
  </g>

  <!-- Top Column Track Headers -->
  <g transform="translate(130, 75)">
    <!-- Col 1 -->
    <rect x="0" y="0" width="220" height="30" rx="6" fill="#e0f2fe" stroke="#38bdf8" />
    <text x="110" y="20" class="track-header">Column 1 (1fr)</text>

    <!-- Col 2 -->
    <rect x="240" y="0" width="220" height="30" rx="6" fill="#e0f2fe" stroke="#38bdf8" />
    <text x="350" y="20" class="track-header">Column 2 (1fr)</text>

    <!-- Col 3 -->
    <rect x="480" y="0" width="220" height="30" rx="6" fill="#e0f2fe" stroke="#38bdf8" />
    <text x="590" y="20" class="track-header">Column 3 (1fr)</text>
  </g>

  <!-- Left Row Track Headers (Horizontal, No awkward rotation!) -->
  <g transform="translate(30, 120)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="85" height="150" rx="8" fill="#f1f5f9" stroke="#cbd5e1" />
    <text x="42" y="70" class="row-header">Row 1</text>
    <text x="42" y="90" font-family="'Fira Code', monospace" font-size="10" fill="#94a3b8" text-anchor="middle">1fr</text>

    <!-- Row 2 -->
    <rect x="0" y="170" width="85" height="150" rx="8" fill="#f1f5f9" stroke="#cbd5e1" />
    <text x="42" y="240" class="row-header">Row 2</text>
    <text x="42" y="260" font-family="'Fira Code', monospace" font-size="10" fill="#94a3b8" text-anchor="middle">1fr</text>
  </g>

  <!-- Grid Items (2 Rows x 3 Columns) -->
  <g transform="translate(130, 120)">
    <!-- ROW 1 -->
    <!-- Card 1 -->
    <rect x="0" y="0" width="220" height="150" rx="10" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5" />
    <text x="110" y="70" class="card-name">Card 1</text>
    <text x="110" y="95" class="code-pos">grid-row: 1; grid-column: 1;</text>

    <!-- Card 2 -->
    <rect x="240" y="0" width="220" height="150" rx="10" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5" />
    <text x="350" y="70" class="card-name">Card 2</text>
    <text x="350" y="95" class="code-pos">grid-row: 1; grid-column: 2;</text>

    <!-- Card 3 -->
    <rect x="480" y="0" width="220" height="150" rx="10" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5" />
    <text x="590" y="70" class="card-name">Card 3</text>
    <text x="590" y="95" class="code-pos">grid-row: 1; grid-column: 3;</text>

    <!-- ROW 2 -->
    <!-- Card 4 -->
    <rect x="0" y="170" width="220" height="150" rx="10" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5" />
    <text x="110" y="240" class="card-name">Card 4</text>
    <text x="110" y="265" class="code-pos">grid-row: 2; grid-column: 1;</text>

    <!-- Card 5 -->
    <rect x="240" y="170" width="220" height="150" rx="10" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5" />
    <text x="350" y="240" class="card-name">Card 5</text>
    <text x="350" y="265" class="code-pos">grid-row: 2; grid-column: 2;</text>

    <!-- Card 6 -->
    <rect x="480" y="170" width="220" height="150" rx="10" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5" />
    <text x="590" y="240" class="card-name">Card 6</text>
    <text x="590" y="265" class="code-pos">grid-row: 2; grid-column: 3;</text>

    <!-- Gap Indicator Badge -->
    <rect x="210" y="148" width="80" height="24" rx="4" fill="#fef3c7" stroke="#fde68a" />
    <text x="250" y="164" font-family="'Fira Code', monospace" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">gap: 20px</text>
  </g>

  <!-- Bottom Explanatory Footnote -->
  <g transform="translate(130, 448)">
    <text x="350" y="15" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
      CSS Grid automatically flows surplus items onto subsequent rows while keeping all columns perfectly aligned.
    </text>
  </g>
</svg>
