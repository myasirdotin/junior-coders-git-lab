<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Playground | Junior Coders</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Fira+Code&display=swap" rel="stylesheet">
</head>
<body>

    <main class="module-container" style="max-width: 1200px;">
        <header class="module-header">
            <h1>CSS Playground</h1>
            <p>Style your web pages in real-time.</p>
        </header>

        <section class="content-section">
            <div class="playground-container">
                <div class="editor-area" style="display: flex; flex-direction: column; gap: 1rem;">
                    <div>
                        <label>HTML</label>
                        <textarea id="html-editor" style="height: 200px;" placeholder="<div class='box'>Hello!</div>"></textarea>
                    </div>
                    <div>
                        <label>CSS</label>
                        <textarea id="css-editor" style="height: 200px;" placeholder=".box { color: red; }"></textarea>
                    </div>
                </div>
                <div class="preview-area">
                    <label>Live Preview</label>
                    <div id="preview" style="background: white; min-height: 420px; border-radius: 1rem;"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="../js/core.js"></script>
    <script src="../js/playground.js"></script>
</body>
</html>
