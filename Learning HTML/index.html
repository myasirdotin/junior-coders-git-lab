<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Playground | Junior Coders</title>
    
    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Fira+Code&display=swap" rel="stylesheet">
    
    <!-- Design System -->
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="css/lesson.css">
</head>
<body>

    <main class="module-container" style="max-width: 1200px;">
        
        <header class="module-header">
            <span class="badge">Lab</span>
            <h1>HTML Playground</h1>
            <p>Write code, see results, and experiment freely.</p>
        </header>

        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; align-items: start;">
            
            <!-- Instructions Panel -->
            <aside class="content-section" style="position: sticky; top: 100px;">
                <h3>Mission Guide</h3>
                <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 1.5rem;">Follow these steps to build your first page:</p>
                <ol style="display: flex; flex-direction: column; gap: 1rem; color: var(--text-secondary); font-size: 0.9rem;">
                    <li><strong>Type Tags:</strong> Enter HTML in the dark editor.</li>
                    <li><strong>Live Preview:</strong> Watch the box below update instantly.</li>
                    <li><strong>Experiment:</strong> Change colors, text, and headings.</li>
                </ol>
                <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid var(--border-dim);">
                <div class="button-group" style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <button class="btn-primary" onclick="loadExample()" style="width: 100%;">Load Example</button>
                    <button class="btn-primary" onclick="clearAll()" style="width: 100%; background: #334155;">Clear Workspace</button>
                </div>
            </aside>

            <!-- Playground Area -->
            <section>
                <div class="playground-container" style="grid-template-columns: 1fr; gap: 2rem;">
                    <div class="editor-area">
                        <label>Code Editor</label>
                        <textarea id="code-editor" spellcheck="false" placeholder="<h1>Hello!</h1>"></textarea>
                    </div>
                    <div class="preview-area">
                        <label>Live Output</label>
                        <div id="preview" style="height: 400px; border: 1px solid var(--border-dim);"></div>
                    </div>
                </div>
            </section>

        </div>

    </main>

    <script src="js/script.js"></script>
</body>
</html>
