<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersecurity Exercises: Practice with Instant Checks | Junior Coders</title>
    <meta name="description" content="Self-checked Cybersecurity exercises for school students in three levels (warm-up, apply, challenge), each linked to its lesson and textbook chapter.">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/bei-core.css">
</head>
<body>
    <main class="module-container">
        <header class="module-header path-cyber">
            <span class="badge" style="background: white; color: var(--cyber-brand);">Practice</span>
            <h1>Cybersecurity Exercises 🛡️</h1>
            <p>Defence only: spot the weak line, choose the safe option and put protection steps in order. This page checks your answers itself.</p>
        </header>

        <section class="sqlx-intro">
            <div class="sqlx-progress">
                <strong><span id="pcDone">0</span> of <span id="pcTotal">0</span> solved</strong>
                <span class="sqlx-progress-bar"><span id="pcBar"></span></span>
            </div>
            <div class="sqlx-tiers">
                <button type="button" class="sqlx-tier-btn active" data-tier="all">All</button>
                <button type="button" class="sqlx-tier-btn" data-tier="1">🟢 Warm-up</button>
                <button type="button" class="sqlx-tier-btn" data-tier="2">🟡 Apply</button>
                <button type="button" class="sqlx-tier-btn" data-tier="3">🔴 Challenge</button>
            </div>
            <p class="sqlx-note">Want to try the tools? Open the <a href="playground.html">Cyber Defense Studio</a>.</p>
        </section>

        <section id="pcList" class="sqlx-list" aria-live="polite"></section>
    </main>

    <script src="../js/practice-cards.js"></script>
    <script src="../js/data/cybersecurity-practice.js"></script>
    <script>
        PracticeCards.mount({ exercises: (window.JC_PRACTICE || {}).cybersecurity || [], prefix: 'cybersecurity', book: 'cybersecurity' });
    </script>
    <script src="../js/bei-nav.js"></script>
    <script src="../js/tts-voices.js"></script>
    <script src="../js/core.js"></script>
</body>
</html>
