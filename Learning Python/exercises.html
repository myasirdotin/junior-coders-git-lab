<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Exercises: Practice with Instant Checks | Junior Coders</title>
    <meta name="description" content="Self-checked Python exercises for school students in three levels (warm-up, apply, challenge), each linked to its lesson and textbook chapter.">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/bei-core.css">
</head>
<body>
    <main class="module-container">
        <header class="module-header path-python">
            <span class="badge" style="background: white; color: var(--python-brand);">Practice</span>
            <h1>Python Exercises 🐍</h1>
            <p>Warm up by reading code, then write real Python. Your program runs right here in the browser and is checked against the expected output.</p>
        </header>

        <section class="sqlx-intro">
            <div class="sqlx-progress">
                <strong><span id="pcDone">0</span> of <span id="pcTotal">0</span> solved</strong>
                <span class="sqlx-progress-bar"><span id="pcBar"></span></span>
                <span class="sqlx-engine" id="pcEngine"></span>
            </div>
            <div class="sqlx-tiers">
                <button type="button" class="sqlx-tier-btn active" data-tier="all">All</button>
                <button type="button" class="sqlx-tier-btn" data-tier="1">🟢 Warm-up</button>
                <button type="button" class="sqlx-tier-btn" data-tier="2">🟡 Apply</button>
                <button type="button" class="sqlx-tier-btn" data-tier="3">🔴 Challenge</button>
            </div>
            <p class="sqlx-note">Want to experiment freely first? Open the <a href="../studios/python-console/index.html">Python Console</a>.</p>
        </section>

        <section id="pcList" class="sqlx-list" aria-live="polite"></section>
    </main>

    <script src="../js/py-lab.js"></script>
    <script src="../js/practice-cards.js"></script>
    <script src="../js/data/python-practice.js"></script>
    <script>
        PracticeCards.mount({ exercises: (window.JC_PRACTICE || {}).python || [], prefix: 'python', book: 'python' });
    </script>
    <script src="../js/bei-nav.js"></script>
    <script src="../js/tts-voices.js"></script>
    <script src="../js/core.js"></script>
</body>
</html>
