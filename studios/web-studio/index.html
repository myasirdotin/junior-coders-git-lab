<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Studio (HTML, CSS &amp; JS Lab) | Junior Coders</title>
    <meta name="description" content="Consolidated live Web Studio: edit HTML5, CSS3, and JavaScript side-by-side with instantaneous live preview and responsive device viewports.">
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="../../styles/bei-core.css">
    <style>
        .web-studio-page {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: var(--bg-page);
        }
    </style>
</head>
<body class="web-studio-page ide-mode">

    <!-- Phones: show the code or the preview, one at a time (styles in bei-core.css "WEB STUDIO ON PHONES") -->
    <div class="studio-view-switch" role="tablist" aria-label="Show code or preview">
        <button type="button" role="tab" class="studio-view-btn active" data-view="code" aria-selected="true">✏️ Code</button>
        <button type="button" role="tab" class="studio-view-btn" data-view="preview" aria-selected="false">👁️ Preview</button>
    </div>

    <!-- Web Studio IDE -->
    <div class="master-playground-container studio-view-code">
        <!-- Editor Panel -->
        <section class="ide-editor-panel">
            <div class="ide-tabs">
                <div class="ide-tabs-group">
                    <button class="ide-tab active" data-tab="html">index.html</button>
                    <button class="ide-tab" data-tab="css">style.css</button>
                    <button class="ide-tab" data-tab="js">script.js</button>
                </div>
                <div class="ide-actions-group">
                    <select id="ide-template-select" class="ide-template-select" aria-label="Choose Starter Template">
                        <option value="default">⚡ Template: Welcome</option>
                        <option value="profile">👤 Template: Profile Card</option>
                        <option value="counter">🔢 Template: Interactive Counter</option>
                        <option value="blank">📄 Template: Blank Canvas</option>
                    </select>
                    <button id="export-project-btn" class="ide-btn-export" title="Download standalone HTML file">
                        <span>💾</span> <span>Export .html</span>
                    </button>
                </div>
            </div>
            <div class="ide-content-area">
                <textarea id="master-html" class="ide-textarea active" spellcheck="false" placeholder="<!-- Write your HTML here -->
<h1>My School Project</h1>
<p>Edit HTML, CSS, and JS to see updates instantly!</p>"></textarea>
                <textarea id="master-css" class="ide-textarea" spellcheck="false" placeholder="/* Write your CSS here */
h1 {
    color: #4f46e5;
    font-family: sans-serif;
}"></textarea>
                <textarea id="master-js" class="ide-textarea" spellcheck="false" placeholder="// Write your JavaScript here
console.log('Web Studio initialized. Ready to create!');"></textarea>
            </div>
            <!-- Console -->
            <div class="ide-console" id="master-console">
                <div class="console-entry">--- System Ready. Happy Coding! ---</div>
            </div>
        </section>

        <!-- Preview Panel -->
        <section class="ide-preview-panel">
            <div class="preview-header">
                <span class="preview-badge">Live Preview</span>
                <div class="viewport-controls">
                    <button class="viewport-btn active" data-width="100%">💻 Desktop</button>
                    <button class="viewport-btn" data-width="768px">📟 Tablet</button>
                    <button class="viewport-btn" data-width="375px">📱 Mobile</button>
                </div>
                <button class="btn-icon" type="button" onclick="window.refreshStudioPreview && window.refreshStudioPreview()" title="Run the code again" aria-label="Run the code again">🔄</button>
            </div>
            <iframe id="master-preview" title="Live code preview" sandbox="allow-scripts"></iframe>
        </section>
    </div>

    <!-- Socratic AI Tutor Drawer Container -->
    <div id="socraticTutorContainer"></div>

    <!-- Core Scripts -->
    <script src="../../js/bei-core.js"></script>
    <script src="../../js/bei-nav.js"></script>
    <script src="../../js/tts-voices.js"></script>
    <script src="../../js/core.js"></script>
    <script src="../../js/playground.js"></script>
    <script src="../../js/bei-tutor.js"></script>
    <script>
        // Code / Preview switch for phones (on wider screens both panels show side by side)
        (function () {
            const box = document.querySelector('.master-playground-container');
            document.querySelectorAll('.studio-view-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const view = btn.dataset.view;
                    box.classList.toggle('studio-view-code', view === 'code');
                    box.classList.toggle('studio-view-preview', view === 'preview');
                    document.querySelectorAll('.studio-view-btn').forEach(b => {
                        const on = b === btn;
                        b.classList.toggle('active', on);
                        b.setAttribute('aria-selected', on ? 'true' : 'false');
                    });
                    window.scrollTo(0, 0);
                });
            });
        })();

        document.addEventListener('DOMContentLoaded', () => {
            if (window.BeiTutor) {
                window.BeiTutor.initTutor('socraticTutorContainer', () => {
                    const jsEl = document.getElementById('master-js');
                    const htmlEl = document.getElementById('master-html');
                    return (jsEl ? jsEl.value : '') || (htmlEl ? htmlEl.value : '');
                });
            }
        });
    </script>
</body>
</html>
