<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-Browser Python Console (Pyodide) | Junior Coders</title>
    <meta name="description" content="Execute real Python 3 code in your browser with zero installations. Built-in interactive console for school learners with stdout capture and preset algorithms.">
    <link rel="stylesheet" href="../../styles/bei-core.css">
    <style>
        .console-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            height: calc(100vh - 120px);
            margin: 1rem 0 2rem;
        }
        @media (max-width: 860px) {
            .console-layout {
                grid-template-columns: 1fr;
                height: auto;
            }
        }
        .code-pane {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .pane-toolbar {
            background: var(--bg-surface-elevated);
            padding: 0.6rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border-subtle);
            flex-wrap: wrap;
        }
        .pane-title {
            font-size: 0.88rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .code-textarea {
            width: 100%;
            flex: 1;
            min-height: 350px;
            background: #020617;
            color: #f8fafc;
            border: none;
            padding: 1rem;
            font-family: var(--font-mono);
            font-size: 0.95rem;
            line-height: 1.5;
            resize: none;
            outline: none;
        }
        .output-terminal {
            background: #020617;
            color: #38bdf8;
            padding: 1rem;
            font-family: var(--font-mono);
            font-size: 0.88rem;
            line-height: 1.5;
            flex: 1;
            min-height: 350px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .output-line-error {
            color: #f87171;
        }
        .output-line-system {
            color: #94a3b8;
        }
        .snippet-select {
            background: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            padding: 0.35rem 0.6rem;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            outline: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <nav class="bei-nav">
        <div class="container bei-nav-inner">
            <a href="../../index.html" class="bei-logo">
                <div class="bei-logo-icon">💻</div>
                <div>
                    Junior Coders
                    <span class="bei-logo-sub">School Computer Science</span>
                </div>
            </a>
            <ul class="bei-nav-links">
                <li><a href="../../learn/python/index.html" class="bei-nav-link">🐍 Python Course</a></li>
                <li><a href="../index.html" class="bei-nav-link active">⚡ Studios</a></li>

                <li><a href="../../book-python/index.html" class="bei-nav-link">📖 15 Ch Book</a></li>
            </ul>
            <div class="bei-nav-actions">
                <button class="theme-toggle-btn" aria-label="Toggle theme">☀️</button>
                <a href="../web-studio/index.html" class="btn-hero-secondary" style="padding: 0.45rem 0.9rem; font-size: 0.82rem;">Web Studio 🌐</a>

    <main class="container">
        <!-- Interactive Console Grid -->
        <div class="console-layout">
            <!-- Left: Python Editor -->
            <div class="code-pane">
                <div class="pane-toolbar">
                    <span class="pane-title">🐍 script.py</span>
                    <div style="display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap;">
                        <select id="pythonSnippetSelect" class="snippet-select" aria-label="Preset Snippets">
                            <option value="welcome">⚡ Snippet: Welcome &amp; Loop</option>
                            <option value="zakat">🤲 Snippet: Zakat Calculator</option>
                            <option value="grades">📊 Snippet: Student Grade Analyzer</option>
                            <option value="fibonacci">🔢 Snippet: Fibonacci Sequence</option>
                            <option value="wordcount">📖 Snippet: Word Frequency Counter</option>
                            <option value="solar">☀️ Snippet: Solar Data Report</option>
                            <option value="classifier">🌿 Snippet: Plant Health Classifier</option>
                        </select>
                        <button id="runPythonBtn" class="btn-hero-primary" style="padding: 0.35rem 0.9rem; font-size: 0.82rem; background: var(--brand-purple);" disabled>
                            ▶ Run Code
                        </button>
                    </div>
                </div>
                <textarea id="pythonEditor" class="code-textarea" spellcheck="false"># Welcome to the In-Browser Python Console!
# Code executes right in your browser.

students = [
    {"name": "Zayd", "score": 92},
    {"name": "Maryam", "score": 88},
    {"name": "Bilal", "score": 95},
    {"name": "Fatima", "score": 90}
]

print("=== Student Honor Roll ===")
total = 0
for s in students:
    total += s["score"]
    status = "Excellence (Mumtaz)" if s["score"] >= 90 else "Good"
    print(f"• {s['name']}: {s['score']}% -> {status}")

average = total / len(students)
print(f"\nClass Average: {average:.1f}%")
print("Knowledge sought for benefit: 'Ilm Nafi'")
</textarea>
            </div>

            <!-- Right: Interactive Output -->
            <div class="code-pane">
                <div class="pane-toolbar">
                    <span class="pane-title">📟 Standard Output &amp; Terminal</span>
                    <div style="display: flex; gap: 0.4rem;">
                        <span id="pyodideStatus" class="placement-badge" style="background: rgba(250,204,21,0.12); color: #facc15; font-size: 0.72rem;">
                            ⏳ Loading Python…
                        </span>
                        <button id="clearConsoleBtn" class="btn-hero-secondary" style="padding: 0.3rem 0.6rem; font-size: 0.75rem;">Clear</button>
                    </div>
                </div>
                <div id="pythonOutput" class="output-terminal">
⏳ Downloading the Python engine (Pyodide, a few MB, only the first time). Run Code switches on when it is ready.
                </div>
            </div>
        </div>
    </main>

    <!-- Pyodide In-Browser WebAssembly Python Engine -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
    <script>
        let pyodideInstance = null;
        let isPyodideLoading = false;

        const outputEl = document.getElementById('pythonOutput');
        const statusEl = document.getElementById('pyodideStatus');
        const runBtn = document.getElementById('runPythonBtn');
        const clearBtn = document.getElementById('clearConsoleBtn');
        const editorEl = document.getElementById('pythonEditor');
        const snippetSelect = document.getElementById('pythonSnippetSelect');

        const snippets = {
            welcome: `# Welcome & Loop Example
for i in range(1, 6):
    print(f"Counting step: {i} - Seeking beneficial knowledge")
`,
            zakat: `# Charitable Zakat Calculator (2.5% on wealth held for a lunar year)
wealth_savings = 500000  # Currency units
nisab_threshold = 120000 # Minimum threshold

if wealth_savings >= nisab_threshold:
    zakat_due = wealth_savings * 0.025
    print(f"Total Wealth: {wealth_savings}")
    print(f"Nisab Exceeded: Yes")
    print(f"Zakat Due (2.5%): {zakat_due}")
    print("Action: Distribute transparently to the community.")
else:
    print("Wealth is below Nisab. No Zakat due.")
`,
            grades: `# Student Grade Classification
scores = [78, 92, 85, 64, 99, 88]
grades = []

for s in scores:
    if s >= 90: grades.append("A")
    elif s >= 80: grades.append("B")
    elif s >= 70: grades.append("C")
    else: grades.append("D")

print("Raw Scores:", scores)
print("Letter Grades:", grades)
`,
            fibonacci: `# Fibonacci Generator
def fibonacci(n):
    sequence = [0, 1]
    while len(sequence) < n:
        sequence.append(sequence[-1] + sequence[-2])
    return sequence

print("First 10 Fibonacci Numbers:")
print(fibonacci(10))
`,
            wordcount: `# Word Frequency Analysis
text = "trust honesty excellence trust knowledge honesty trust"
words = text.split()
counts = {}

for w in words:
    counts[w] = counts.get(w, 0) + 1

for word, count in counts.items():
    print(f"{word:12} : {'█' * count} ({count})")
`,
            solar: `# Community Solar Farm Report
daily_harvest_kwh = [45.2, 52.0, 39.5, 48.1, 55.4, 49.0, 51.2]
total = sum(daily_harvest_kwh)
average = total / len(daily_harvest_kwh)

print("☀️ WEEKLY CLEAN ENERGY REPORT")
print(f"Total generation : {total:.1f} kWh")
print(f"Daily average    : {average:.1f} kWh")
print(f"Best day         : {max(daily_harvest_kwh)} kWh")
`,
            classifier: `# A simple rule-based plant health check (teaching example, not a real diagnosis)
def classify_crop_health(leaf_spots, humidity):
    if leaf_spots == 0 and humidity < 60:
        return "Healthy plant 🌿"
    elif leaf_spots > 5 and humidity >= 70:
        return "High blight risk ⚠️ (ask an expert)"
    else:
        return "Keep watching 🔍"

test_batch = [
    {"plant": "Olive-A1", "spots": 0, "humidity": 45},
    {"plant": "Date-B4", "spots": 8, "humidity": 78},
    {"plant": "Fig-C2", "spots": 2, "humidity": 55}
]

print("🤖 CROP HEALTH CHECK")
for crop in test_batch:
    diagnosis = classify_crop_health(crop["spots"], crop["humidity"])
    print(f"{crop['plant']:<8} | spots: {crop['spots']} | {diagnosis}")
`
        };

        snippetSelect.addEventListener('change', () => {
            const val = snippetSelect.value;
            if (snippets[val]) {
                editorEl.value = snippets[val];
            }
        });

        clearBtn.addEventListener('click', () => {
            outputEl.innerHTML = '';
        });

        // Run Code stays off until real Python (Pyodide) is ready; there is no pretend runner (GEMINI §7h)
        function setStatus(text, color) {
            statusEl.innerText = text;
            statusEl.style.color = color;
            statusEl.style.background = 'transparent';
        }

        async function loadPyodideEngine() {
            if (pyodideInstance) return pyodideInstance;
            if (isPyodideLoading) return null;
            isPyodideLoading = true;
            try {
                if (typeof loadPyodide === 'undefined') throw new Error('the Pyodide script did not load');
                pyodideInstance = await loadPyodide({
                    stdout: (text) => appendOutput(text),
                    stderr: (text) => appendOutput(text, true)
                });
                setStatus('✅ Python ' + pyodideInstance.runPython('import sys; sys.version.split()[0]') + ' ready', '#34d399');
                outputEl.innerHTML = '<div class="output-line-system">--- Python is ready. Press ▶ Run Code. ---</div>';
                runBtn.disabled = false;
            } catch (err) {
                console.warn('Pyodide could not load:', err);
                setStatus('⚠️ Python could not load', '#f97316');
                outputEl.innerHTML = '';
                appendOutput('Python could not load. The first visit needs an internet connection to download it; check your connection and reload the page.', true);
            } finally {
                isPyodideLoading = false;
            }
            return pyodideInstance;
        }

        function appendOutput(text, isError = false) {
            const div = document.createElement('div');
            if (isError) div.className = 'output-line-error';
            div.textContent = text;
            outputEl.appendChild(div);
            outputEl.scrollTop = outputEl.scrollHeight;
        }

        runBtn.addEventListener('click', async () => {
            const code = editorEl.value;
            outputEl.innerHTML = '<div class="output-line-system">--- Executing Python Code ---</div>';

            if (!pyodideInstance) return;
            runBtn.disabled = true;
            try {
                await pyodideInstance.runPythonAsync(code);
            } catch (err) {
                appendOutput(String(err), true);
            }
            runBtn.disabled = false;
        });

        // Tab indentation (4 spaces) and Ctrl+Enter execution
        editorEl.addEventListener('keydown', (e) => {
            if (e.key === 'Tab' && !e.shiftKey) {
                e.preventDefault();
                const s = editorEl.selectionStart;
                editorEl.setRangeText('    ', s, editorEl.selectionEnd, 'end');
                editorEl.dispatchEvent(new Event('input'));
            } else if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                runBtn.click();
            }
        });

        // Initialize engine in background
        loadPyodideEngine();
    </script>
    <script src="../../js/bei-core.js"></script>
    <script src="../../js/bei-nav.js"></script>
</body>
</html>
