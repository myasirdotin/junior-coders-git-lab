<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-Browser Python Console (Pyodide) | BEI Coders</title>
    <meta name="description" content="Execute real Python 3 code in your browser with zero installations. Built-in interactive console for school learners with stdout capture and preset algorithms.">
    <link rel="stylesheet" href="../../styles/bei-core.css">
    <style>
        .console-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            height: calc(100vh - 120px);
            margin: 1rem 0 2rem;
        }
        @media (max-width: 860px) {
            .console-layout {
                grid-template-columns: 1fr;
                height: auto;
            }
        }
        .code-pane {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .pane-toolbar {
            background: var(--bg-surface-elevated);
            padding: 0.6rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border-subtle);
            flex-wrap: wrap;
        }
        .pane-title {
            font-size: 0.88rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .code-textarea {
            width: 100%;
            flex: 1;
            min-height: 350px;
            background: #020617;
            color: #f8fafc;
            border: none;
            padding: 1rem;
            font-family: var(--font-mono);
            font-size: 0.95rem;
            line-height: 1.5;
            resize: none;
            outline: none;
        }
        .output-terminal {
            background: #020617;
            color: #38bdf8;
            padding: 1rem;
            font-family: var(--font-mono);
            font-size: 0.88rem;
            line-height: 1.5;
            flex: 1;
            min-height: 350px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .output-line-error {
            color: #f87171;
        }
        .output-line-system {
            color: #94a3b8;
        }
        .snippet-select {
            background: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            padding: 0.35rem 0.6rem;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            outline: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <nav class="bei-nav">
        <div class="container bei-nav-inner">
            <a href="../../index.html" class="bei-logo">
                <div class="bei-logo-icon">💻</div>
                <div>
                    BEI Coders
                    <span class="bei-logo-sub">School Computer Science</span>
                </div>
            </a>
            <ul class="bei-nav-links">
                <li><a href="../../learn/python/index.html" class="bei-nav-link">🐍 Python Course</a></li>
                <li><a href="../index.html" class="bei-nav-link active">⚡ Studios</a></li>
                <li><a href="../../cheatsheet-python.html" class="bei-nav-link">📋 Cheatsheet</a></li>
                <li><a href="../../book-python/index.html" class="bei-nav-link">📖 15 Ch Book</a></li>
            </ul>
            <div class="bei-nav-actions">
                <button class="theme-toggle-btn" aria-label="Toggle theme">☀️</button>
                <a href="../web-studio/index.html" class="btn-hero-secondary" style="padding: 0.45rem 0.9rem; font-size: 0.82rem;">Web Studio 🌐</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <!-- Interactive Console Grid -->
        <div class="console-layout">
            <!-- Left: Python Editor -->
            <div class="code-pane">
                <div class="pane-toolbar">
                    <span class="pane-title">🐍 script.py</span>
                    <div style="display: flex; gap: 0.4rem; align-items: center;">
                        <select id="pythonSnippetSelect" class="snippet-select" aria-label="Preset Snippets">
                            <option value="welcome">⚡ Snippet: Welcome &amp; Loop</option>
                            <option value="zakat">🤲 Snippet: Zakat Calculator</option>
                            <option value="grades">📊 Snippet: Student Grade Analyzer</option>
                            <option value="fibonacci">🔢 Snippet: Fibonacci Sequence</option>
                            <option value="wordcount">📖 Snippet: Word Frequency Counter</option>
                        </select>
                        <button id="runPythonBtn" class="btn-hero-primary" style="padding: 0.35rem 0.9rem; font-size: 0.82rem; background: var(--brand-purple);">
                            ▶ Run Code
                        </button>
                    </div>
                </div>
                <textarea id="pythonEditor" class="code-textarea" spellcheck="false"># Welcome to the In-Browser Python Console!
# Code executes right in your browser.

students = [
    {"name": "Zayd", "score": 92},
    {"name": "Maryam", "score": 88},
    {"name": "Bilal", "score": 95},
    {"name": "Fatima", "score": 90}
]

print("=== Student Honor Roll ===")
total = 0
for s in students:
    total += s["score"]
    status = "Excellence (Mumtaz)" if s["score"] >= 90 else "Good"
    print(f"• {s['name']}: {s['score']}% -> {status}")

average = total / len(students)
print(f"\nClass Average: {average:.1f}%")
print("Knowledge sought for benefit: 'Ilm Nafi'")
</textarea>
            </div>

            <!-- Right: Interactive Output -->
            <div class="code-pane">
                <div class="pane-toolbar">
                    <span class="pane-title">📟 Standard Output &amp; Terminal</span>
                    <div style="display: flex; gap: 0.4rem;">
                        <span id="pyodideStatus" class="placement-badge" style="background: rgba(16,185,129,0.15); color: #34d399; font-size: 0.72rem;">
                            Engine: Ready
                        </span>
                        <button id="clearConsoleBtn" class="btn-hero-secondary" style="padding: 0.3rem 0.6rem; font-size: 0.75rem;">Clear</button>
                    </div>
                </div>
                <div id="pythonOutput" class="output-terminal">
--- Python Engine Initialized. Click '▶ Run Code' to execute. ---
                </div>
            </div>
        </div>
    </main>

    <!-- Pyodide In-Browser WebAssembly Python Engine -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
    <script>
        let pyodideInstance = null;
        let isPyodideLoading = false;

        const outputEl = document.getElementById('pythonOutput');
        const statusEl = document.getElementById('pyodideStatus');
        const runBtn = document.getElementById('runPythonBtn');
        const clearBtn = document.getElementById('clearConsoleBtn');
        const editorEl = document.getElementById('pythonEditor');
        const snippetSelect = document.getElementById('pythonSnippetSelect');

        const snippets = {
            welcome: `# Welcome & Loop Example
for i in range(1, 6):
    print(f"Counting step: {i} - Seeking beneficial knowledge")
`,
            zakat: `# Charitable Zakat Calculator (2.5% on wealth held for a lunar year)
wealth_savings = 500000  # Currency units
nisab_threshold = 120000 # Minimum threshold

if wealth_savings >= nisab_threshold:
    zakat_due = wealth_savings * 0.025
    print(f"Total Wealth: {wealth_savings}")
    print(f"Nisab Exceeded: Yes")
    print(f"Zakat Due (2.5%): {zakat_due}")
    print("Action: Distribute transparently to the community.")
else:
    print("Wealth is below Nisab. No Zakat due.")
`,
            grades: `# Student Grade Classification
scores = [78, 92, 85, 64, 99, 88]
grades = []

for s in scores:
    if s >= 90: grades.append("A")
    elif s >= 80: grades.append("B")
    elif s >= 70: grades.append("C")
    else: grades.append("D")

print("Raw Scores:", scores)
print("Letter Grades:", grades)
`,
            fibonacci: `# Fibonacci Generator
def fibonacci(n):
    sequence = [0, 1]
    while len(sequence) < n:
        sequence.append(sequence[-1] + sequence[-2])
    return sequence

print("First 10 Fibonacci Numbers:")
print(fibonacci(10))
`,
            wordcount: `# Word Frequency Analysis
text = "trust honesty excellence trust knowledge honesty trust"
words = text.split()
counts = {}

for w in words:
    counts[w] = counts.get(w, 0) + 1

for word, count in counts.items():
    print(f"{word:12} : {'█' * count} ({count})")
`
        };

        snippetSelect.addEventListener('change', () => {
            const val = snippetSelect.value;
            if (snippets[val]) {
                editorEl.value = snippets[val];
            }
        });

        clearBtn.addEventListener('click', () => {
            outputEl.innerHTML = '';
        });

        async function loadPyodideEngine() {
            if (pyodideInstance) return pyodideInstance;
            if (isPyodideLoading) return;

            isPyodideLoading = true;
            statusEl.innerText = 'Loading Pyodide (Wasm)...';
            statusEl.style.color = '#facc15';

            try {
                if (typeof loadPyodide !== 'undefined') {
                    pyodideInstance = await loadPyodide({
                        stdout: (text) => appendOutput(text),
                        stderr: (text) => appendOutput(text, true)
                    });
                    statusEl.innerText = 'Pyodide Wasm: Active';
                    statusEl.style.color = '#34d399';
                } else {
                    statusEl.innerText = 'Local Sandbox Mode';
                    statusEl.style.color = '#38bdf8';
                }
            } catch (err) {
                console.warn('Pyodide load failed (offline or blocked). Using fallback simulator:', err);
                statusEl.innerText = 'Offline Fallback Active';
                statusEl.style.color = '#f97316';
            } finally {
                isPyodideLoading = false;
            }
            return pyodideInstance;
        }

        function appendOutput(text, isError = false) {
            const div = document.createElement('div');
            if (isError) div.className = 'output-line-error';
            div.textContent = text;
            outputEl.appendChild(div);
            outputEl.scrollTop = outputEl.scrollHeight;
        }

        runBtn.addEventListener('click', async () => {
            const code = editorEl.value;
            outputEl.innerHTML = '<div class="output-line-system">--- Executing Python Code ---</div>';

            try {
                const py = await loadPyodideEngine();
                if (py) {
                    await py.runPythonAsync(code);
                    if (window.awardXP) window.awardXP(15, 'Python Execution');
                } else {
                    // Lightweight offline demonstration runner
                    simulatePythonExecution(code);
                }
            } catch (err) {
                appendOutput(String(err), true);
            }
        });

        function simulatePythonExecution(code) {
            // Evaluates print statements and basic expressions when offline
            const lines = code.split('\n');
            lines.forEach(line => {
                const match = line.match(/print\s*\((.*)\)/);
                if (match) {
                    try {
                        let inner = match[1].replace(/f"(.*)"/, '$1');
                        appendOutput(inner);
                    } catch(e) {
                        appendOutput(match[1]);
                    }
                }
            });
            appendOutput('\n[Finished in offline execution]');
        }

        // Initialize engine in background
        loadPyodideEngine();
    </script>
    <script src="../../js/bei-core.js"></script>
</body>
</html>
